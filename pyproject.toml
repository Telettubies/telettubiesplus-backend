[project]
name = "analizador"
version = "0.1.0"
description = "Backend del analizador de pliegos y matriz de cobertura (API + worker)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=10.2.3",
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.49.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
analizador-api = "analizador.api.main:run"
analizador-worker = "analizador.worker.main:run"
analizador-cli = "analizador.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caracteres en español (tildes, ñ) en textos y comentarios

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/analizador/db/migrations/**" = ["E501", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["analizador"]
exclude = ["src/analizador/db/migrations/"]

[[tool.mypy.overrides]]
module = ["aio_pika.*", "pgvector.*", "langgraph.*", "pytesseract.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integracion: usa PostgreSQL con pgvector real (TEST_DATABASE_URL o el Compose de desarrollo)",
]
